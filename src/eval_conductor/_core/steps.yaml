   common_fake: "Author labels their own outputs, unblinded"}
- {step: 19, t: T10, phase: IV,  name: "LLM judge, validated",
   tools: "DeepEval G-Eval scaffold; OUR kappa gate",
   exit: "kappa>=0.6 (or >=85%) vs step-18 labels -> frozen+versioned, enters registry SOFT; else monitor_only", evidence_kind: report,
   common_fake: "Judge gating anything before validation; judge entering as hard"}
- {step: 20, t: T22, phase: IV,  name: "Fairness strata",
   tools: "own per-stratum pass-rate report; Fairlearn later",
   exit: "per-stratum table in every battery report", evidence_kind: report,
   common_fake: "Aggregate green while one subgroup collapses, unreported"}
- {step: 21, t: T24, phase: V,   name: "Benchmark (filter-only)",
   tools: "lm-evaluation-harness",
   exit: "model choice documented with contamination caveat; zero benchmark numbers in product claims", evidence_kind: file,
   common_fake: "Benchmark score quoted as product quality"}
- {step: 22, t: T06, phase: V,   name: "Application/fail-closed surface",
   tools: "Playwright (UI) / CI-as-application incl. IE-10 WARN surfacing",
   exit: "every soft warning reaches a human surface; missing inputs fail closed", evidence_kind: ci,
   common_fake: "WARN visible only inside a green CI log"}
- {step: 23, t: T27, phase: V,   never_na: true, name: "Meta-eval E-0",
   tools: "BUILD-OWN process: fresh-context review, author disqualified; quarterly Goodhart + judge calendar",
   exit: "independent review filed with zero unaddressed S1s; calendar created", evidence_kind: file,
   common_fake: "Author session grading its own work and calling it E-0"}
- {step: 24, t: T26, phase: V,   name: "Shadow vs incumbent",
   tools: "BUILD-OWN thin side-by-side + blinded pairwise",
   exit: "promotion criteria committed BEFORE shadow start; decision made by those criteria", evidence_kind: file,
   common_fake: "Criteria written (or bent) after seeing shadow results"}
- {step: 25, t: T25, phase: VI,  name: "HITL review auditing",
   tools: "BUILD-OWN: edit-rate, review-time, rubber-stamp flag on the approval surface",
   exit: "reviewer metrics in weekly report from day one of review", evidence_kind: report,
   common_fake: "'A human approves' claimed with zero reviewer metrics"}
- {step: 26, t: T07, phase: VI,  name: "Online eval + flywheel",
   tools: "Langfuse self-hosted; reference-free, judge-version-matched; weekly ritual",
   exit: "a production failure becomes a permanent regression test within one week", evidence_kind: report,
   common_fake: "Dashboards watched, failures never turned into goldens"}
- {step: 27, t: T21, phase: VI,  name: "Calibration vs outcomes",
   tools: "BUILD-OWN: pandas join + sklearn calibration_curve at >=50 outcomes",
   exit: "calibration curve, or every predictive score prints 'unmeasured'", evidence_kind: report,
   common_fake: "Confident score displayed with zero outcome data"}
