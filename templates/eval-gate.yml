name: eval-gate
# The gate runs on every push and PR — including changes to the gate itself.
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff lint compares the gate against its past self
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Registry schema lint (hard block)
        run: python evals/tools/registry_lint.py evals/registry.yaml
      - name: Registry diff lint — no unjustified gate weakening (hard block)
        # Compares evals/registry.yaml against its version on the base branch.
        # A loosened threshold, flipped direction, downgraded blocking tier,
        # widened band, or removed metric must carry a reason in
        # evals/registry_changes.yaml or this fails. The mechanical form of
        # "never edit a threshold to turn a red gate green".
        run: |
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch -q origin "$GITHUB_BASE_REF"
            python evals/tools/registry_diff_lint.py --base "origin/$GITHUB_BASE_REF"
          else
            python evals/tools/registry_diff_lint.py
          fi
      - name: Produce candidate
        # Must write evals/candidate.json. Adapters for JUnit, claude plugin eval,
        # promptfoo and flat score files: python evals/tools/adapters.py --help
        run: |
__PRODUCE_CANDIDATE__
      - name: Gate (candidate vs baseline)
        run: python evals/tools/promote.py
        # Sign a tamper-evident eval receipt for this decision. The gate emits
        # one automatically when a key is present; add the secret to sign in CI.
        # (Without the key it still gates — receipts just stay unsigned.)
        # env:
        #   EVAL_RECEIPT_KEY: ${{ secrets.EVAL_RECEIPT_KEY }}
      # Make the receipt chain release-blocking: a tampered, forked, or
      # decision-inconsistent receipt fails the build. Commit evals/receipts/.
      # - name: Verify eval receipts
      #   run: python evals/tools/eval_receipt.py verify
      #   env:
      #     EVAL_RECEIPT_KEY: ${{ secrets.EVAL_RECEIPT_KEY }}   # omit for structure-only
      # Pre-registered evals: prove the bar was fixed BEFORE this run. Seal the
      # registry (python evals/tools/prereg.py seal) and commit+push the seal in
      # evals/seals/ BEFORE producing a candidate. This step then fails closed if
      # the registry drifted from the sealed bar — the diff-lint catches a gate
      # that got weaker than its base; this catches a gate tuned to a score you
      # already saw (a brand-new gate the diff-lint cannot judge).
      # - name: Pre-registration check (bar was sealed before the run)
      #   run: python evals/tools/prereg.py check --require-seal
      #   env:
      #     EVAL_RECEIPT_KEY: ${{ secrets.EVAL_RECEIPT_KEY }}   # omit for structure-only
