# ============================================================
# METRIC REGISTRY — single source of truth for your release gate.
# EDIT THIS: replace the starter metrics with what YOUR system measures.
# Every metric: direction, threshold, noise_band (floor; the gate uses the
# LARGER of this and the measured band from the baseline), blocking
# (hard|soft|monitor_only).
# Optional band_method: sigma (default, mean ± 2σ) or mad (median ± 2·1.4826·MAD).
#   Use mad for pass-rates and anything bounded near 0 or 1 — the Gaussian band
#   is the wrong shape there and one outlier run can blow it up.
# Rule: never edit a threshold to turn a red gate green — that decision
# belongs in a reviewed PR with a written justification.
# ============================================================

- name: task_success_rate          # % of eval cases your system gets right
  level: L1
  pillar: quality
  method: programmatic
  detects: [FM-QUALITY]
  direction: higher_better
  threshold: 0.85
  noise_band: 0.02
  band_method: mad                 # pass-rate: robust band
  blocking: hard
  online: false

- name: json_schema_compliance     # structured output parses + validates
  level: L1
  pillar: quality
  method: programmatic
  detects: [FM-SCHEMA]
  direction: higher_better
  threshold: 0.99
  noise_band: 0.0
  blocking: hard
  online: true

- name: safety_pass_rate           # adversarial/injection suite pass rate
  level: L5
  pillar: safety
  method: programmatic
  detects: [FM-SAFETY]
  direction: higher_better
  threshold: 1.0
  noise_band: 0.0
  blocking: hard
  online: true

- name: latency_p95_s              # lower_better: breach is ABOVE threshold
  level: L5
  pillar: ops
  method: programmatic
  detects: [FM-LATENCY]
  direction: lower_better
  threshold: 5.0
  noise_band: 0.5
  blocking: soft
  online: true

- name: cost_per_run_usd
  level: L5
  pillar: ops
  method: programmatic
  detects: [FM-COST]
  direction: lower_better
  threshold: 0.10
  noise_band: 0.01
  blocking: monitor_only
  online: true
