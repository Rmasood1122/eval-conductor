name: "Eval Conductor"
description: "Fail-closed gate that proves your tests/evals didn't regress, with a signed, tamper-evident receipt."
author: "Rehan Masood"
branding:
  icon: "shield"
  color: "green"

inputs:
  command:
    description: "Which gate to run: prove | gate | verify"
    required: false
    default: "prove"
  args:
    description: "Extra arguments passed through to eval-conductor (e.g. '--run \"pytest --junitxml={junit}\"')"
    required: false
    default: ""
  working-directory:
    description: "Directory to run in"
    required: false
    default: "."
  python-version:
    description: "Python to set up"
    required: false
    default: "3.12"
  version:
    description: "eval-conductor version spec to install (e.g. '==1.4.0'); empty = latest"
    required: false
    default: ""
  receipt-key:
    description: "HMAC signing key for receipts. In CI, pass secrets.EVAL_RECEIPT_KEY here."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install eval-conductor
      shell: bash
      env:
        EC_VERSION: ${{ inputs.version }}
      run: |
        # Inputs reach the shell only through env, never spliced into the script.
        if ! [[ "$EC_VERSION" =~ ^([=!~<>]=?=?[0-9A-Za-z.*+!-]+(,[=!~<>]=?=?[0-9A-Za-z.*+!-]+)*)?$ ]]; then
          echo "::error::version must be a version spec like ==1.4.4 (got an invalid value)"
          exit 2
        fi
        python -m pip install --upgrade "eval-conductor${EC_VERSION}"

    - name: Run eval-conductor
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EVAL_RECEIPT_KEY: ${{ inputs.receipt-key }}
        EC_COMMAND: ${{ inputs.command }}
        EC_ARGS: ${{ inputs.args }}
      run: |
        case "$EC_COMMAND" in
          prove|gate|verify) ;;
          *) echo "::error::command must be prove, gate or verify"; exit 2 ;;
        esac
        # shlex splits args like a shell would, quotes included, but runs no
        # command substitution, so $(...) or ; inside args stays a literal.
        python -c 'import os, shlex, subprocess, sys
        sys.exit(subprocess.call(["eval-conductor", os.environ["EC_COMMAND"],
                                  *shlex.split(os.environ.get("EC_ARGS", ""))]))'
