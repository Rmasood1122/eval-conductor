name: "Eval Conductor"
description: "Prove your tests/evals didn't regress — a fail-closed gate with a signed, tamper-evident receipt. Blocks the job on regression."
author: "Rehan Masood"
branding:
  icon: "shield"
  color: "green"

inputs:
  command:
    description: "Which gate to run: prove | gate | verify"
    required: false
    default: "prove"
  args:
    description: "Extra arguments passed through to eval-conductor (e.g. '--run \"pytest --junitxml={junit}\"')"
    required: false
    default: ""
  working-directory:
    description: "Directory to run in"
    required: false
    default: "."
  python-version:
    description: "Python to set up"
    required: false
    default: "3.12"
  version:
    description: "eval-conductor version spec to install (e.g. '==1.4.0'); empty = latest"
    required: false
    default: ""
  receipt-key:
    description: "HMAC signing key for receipts. In CI, pass secrets.EVAL_RECEIPT_KEY here."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install eval-conductor
      shell: bash
      run: python -m pip install --upgrade "eval-conductor${{ inputs.version }}"

    - name: Run eval-conductor ${{ inputs.command }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        EVAL_RECEIPT_KEY: ${{ inputs.receipt-key }}
      run: eval-conductor ${{ inputs.command }} ${{ inputs.args }}
